services:
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # inside docker, "localhost" means the container itself, so this points at Ollama on the host machine
      OLLAMA_URL: ${OLLAMA_URL_DOCKER:-http://host.docker.internal:11434}
    volumes:
      - ./models:/app/models:ro
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  ui:
    build: .
    command: streamlit run app/streamlit_app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
    env_file:
      - path: .env
        required: false
    environment:
      OLLAMA_URL: ${OLLAMA_URL_DOCKER:-http://host.docker.internal:11434}
    volumes:
      - ./models:/app/models:ro
    ports:
      - "8501:8501"
    extra_hosts:
      - "host.docker.internal:host-gateway"
