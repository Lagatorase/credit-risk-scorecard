  AMT_CREDIT: {family: loan_terms, officer: "Loan amount", format: money}
  AMT_ANNUITY: {family: loan_terms, officer: "Yearly repayment", format: money}
  AMT_GOODS_PRICE: {family: loan_terms, officer: "Price of the goods being financed", format: money}
