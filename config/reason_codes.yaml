  BUREAU_ACTIVE_DEBT_RATIO: {family: other_lenders, officer: "Share of credit at other lenders still owed", format: share}
  BUREAU_DEBT_INCOME_RATIO: {family: other_lenders, officer: "Debt at other lenders as a multiple of income", format: times}

