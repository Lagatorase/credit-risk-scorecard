  PREV_APP_COUNT: {family: previous_loans, officer: "Previous applications with Home Credit", customer: "Previous applications with us", format: count}
  PREV_APPROVED_COUNT: {family: previous_loans, officer: "Previous loans granted by Home Credit", customer: "Previous loans with us", format: count}
  PREV_RECENT_1Y_COUNT: {family: previous_loans, officer: "Applications in the last year", format: count}
  PREV_AMT_CREDIT_MEAN: {family: previous_loans, officer: "Average size of previous loans", format: money}
  PREV_AMT_CREDIT_MAX: {family: previous_loans, officer: "Largest previous loan", format: money}
  PREV_ANNUITY_MEAN: {family: previous_loans, officer: "Average yearly repayment on previous loans", format: money}
  PREV_CNT_PAYMENT_MEAN: {family: previous_loans, officer: "Average term of previous loans", format: number, unit: instalments}
  PREV_DOWN_PAYMENT_RATE_MEAN: {family: previous_loans, officer: "Average down payment on previous loans", format: share}
  PREV_DAYS_DECISION_MAX: {family: previous_loans, officer: "Most recent previous application", format: days_ago}
  PREV_DAYS_DECISION_MEAN: {family: previous_loans, officer: "Average age of previous applications", format: days_ago}
  PREV_HIGH_YIELD_SHARE: {family: previous_loans, officer: "Share of previous loans on higher-rate products", format: share}
  INST_COUNT: {family: previous_loans, officer: "Instalments paid on previous loans", format: count}
  POS_MONTH_COUNT: {family: previous_loans, officer: "Months of point-of-sale and cash loan history", format: count}
  POS_LOAN_COUNT: {family: previous_loans, officer: "Previous point-of-sale and cash loans", format: count}
  POS_COMPLETED_SHARE: {family: previous_loans, officer: "Share of point-of-sale and cash loans completed", format: share}
  POS_FUTURE_INSTALMENTS_TOTAL: {family: previous_loans, officer: "Instalments still to pay on open loans", format: count}

  # Credit card use with Home Credit
  CC_MONTH_COUNT: {family: credit_card, officer: "Months of credit card history", format: count}
  CC_CARD_COUNT: {family: credit_card, officer: "Credit cards held", format: count}
  CC_UTIL_MEAN: {family: credit_card, officer: "Average credit card balance as a share of the limit", format: share}
  CC_UTIL_MAX: {family: credit_card, officer: "Highest credit card balance as a share of the limit", format: share}
