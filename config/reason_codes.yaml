  BUREAU_CREDIT_TYPE_COUNT: {family: other_lenders, officer: "Types of credit held at other lenders", format: count}
  BUREAU_DAYS_CREDIT_MAX: {family: other_lenders, officer: "Most recent loan opened at another lender", format: days_ago}
  BUREAU_DAYS_CREDIT_MIN: {family: other_lenders, officer: "Oldest loan opened at another lender", format: days_ago}
