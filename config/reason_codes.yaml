# Reason code text for every model feature.
#
# Each reason states the applicant's actual value and where it sits among development applicants,
# for example "Average size of previous loans: 45,000 (lowest 20% of applicants)". The SHAP value only
# decides which features pushed this applicant's risk up; the text itself never claims a direction.
#
# family:       reasons are grouped, and a list shows at most one reason per family
# officer:      label in the loan officer's view
# customer:     plainer label in the customer's view (defaults to the officer label)
# format:       money, percent, share, times, years, days_ago, days_ahead, count, score, number, flag or category
# unit:         optional word after a count or number, such as days
# officer_only: true keeps the reason out of the customer's list (age, process and contact details)
#
# Gender and marital status are not model inputs, so they never appear here.

# Home Credit doesn't state the currency of the amounts, so none is shown. Set this (e.g. "SGD ") to add one.
currency: ""

families:
  external_scores: External credit bureau scores
  late_payments: Overdue and late payment history
  refusals: Previous application refusals
  other_lenders: Credit with other lenders
  previous_loans: Previous loans with Home Credit
  credit_card: Credit card use
  loan_terms: Loan size and term
  affordability: Income and affordability
  employment: Employment
  demographics: Age and household
  housing: Housing and assets
  region: Region and address
  enquiries: Recent credit enquiries
  social_circle: Social circle
  application_details: Application, contact and document details

features:
  # External credit bureau scores
  EXT_SOURCE_1: {family: external_scores, officer: "External bureau score (source 1)", customer: "Credit bureau score", format: score}
  EXT_SOURCE_2: {family: external_scores, officer: "External bureau score (source 2)", customer: "Credit bureau score", format: score}
  EXT_SOURCE_3: {family: external_scores, officer: "External bureau score (source 3)", customer: "Credit bureau score", format: score}
  EXT_SOURCE_MEAN: {family: external_scores, officer: "Average of the external bureau scores", customer: "Credit bureau score", format: score}
  EXT_SOURCE_MIN: {family: external_scores, officer: "Lowest of the external bureau scores", customer: "Credit bureau score", format: score}

  # Overdue and late payment history, at other lenders and at Home Credit
  BUREAU_OVERDUE_TOTAL: {family: late_payments, officer: "Amount currently overdue at other lenders", format: money}
  BUREAU_OVERDUE_SHARE: {family: late_payments, officer: "Share of loans at other lenders currently overdue", format: share}
  BUREAU_DAYS_OVERDUE_MAX: {family: late_payments, officer: "Longest current overdue at other lenders", format: count, unit: days}
  BUREAU_MAX_OVERDUE_AMT: {family: late_payments, officer: "Largest overdue amount ever at other lenders", format: money}
  BUREAU_BAD_DEBT_OR_SOLD_COUNT: {family: late_payments, officer: "Loans at other lenders written off or sold", format: count}
  BUREAU_PROLONG_COUNT: {family: late_payments, officer: "Loans at other lenders that needed extending", format: count}
  BB_DPD_SHARE_MEAN: {family: late_payments, officer: "Share of months paid late at other lenders (average per loan)", customer: "Share of months paid late at other lenders", format: share}
  BB_DPD_SHARE_MAX: {family: late_payments, officer: "Share of months paid late at other lenders (worst loan)", customer: "Share of months paid late at other lenders", format: share}
  BB_WORST_STATUS_MAX: {family: late_payments, officer: "Worst arrears level at other lenders (0 none, 5 over 120 days)", customer: "Worst arrears level at other lenders", format: number}
  BB_RECENT_DPD_SHARE_MAX: {family: late_payments, officer: "Share of months paid late at other lenders in the last year", format: share}
  INST_LATE_SHARE: {family: late_payments, officer: "Share of instalments paid late", format: share}
  INST_LATE_30_SHARE: {family: late_payments, officer: "Share of instalments paid more than 30 days late", format: share}
  INST_DAYS_LATE_MEAN: {family: late_payments, officer: "Average days late per instalment", format: number, unit: days}
  INST_DAYS_LATE_MAX: {family: late_payments, officer: "Most days late on any instalment", format: count, unit: days}
  INST_UNDERPAID_SHARE: {family: late_payments, officer: "Share of instalments underpaid", format: share}
  INST_SHORTFALL_TOTAL: {family: late_payments, officer: "Total amount underpaid on instalments", format: money}
  INST_RECENT_1Y_LATE_SHARE: {family: late_payments, officer: "Share of instalments paid late in the last year", format: share}
  INST_RECENT_1Y_UNDERPAID_SHARE: {family: late_payments, officer: "Share of instalments underpaid in the last year", format: share}
  INST_PAY_RATIO_MEAN: {family: late_payments, officer: "Average payment as a share of the instalment due", format: share}
  POS_DPD_MAX: {family: late_payments, officer: "Most days past due on a point-of-sale or cash loan", format: count, unit: days}
  POS_DPD_MEAN: {family: late_payments, officer: "Average days past due on point-of-sale and cash loans", format: number, unit: days}
  POS_DPD_SHARE: {family: late_payments, officer: "Share of months past due on point-of-sale and cash loans", format: share}
  POS_DPD_DEF_SHARE: {family: late_payments, officer: "Share of months in arrears on point-of-sale and cash loans", format: share}
  POS_RECENT_1Y_DPD_SHARE: {family: late_payments, officer: "Share of months past due on point-of-sale and cash loans in the last year", format: share}
  CC_DPD_MAX: {family: late_payments, officer: "Most days past due on a credit card", format: count, unit: days}
  CC_DPD_SHARE: {family: late_payments, officer: "Share of months a credit card was past due", format: share}
  CC_MISSED_MIN_SHARE: {family: late_payments, officer: "Share of months paying less than the credit card minimum", format: share}
  CC_RECENT_1Y_MISSED_MIN_SHARE: {family: late_payments, officer: "Share of months paying less than the credit card minimum in the last year", format: share}

  # Previous application refusals and cancellations
  PREV_REFUSED_COUNT: {family: refusals, officer: "Previous applications refused", format: count}
  PREV_REFUSED_SHARE: {family: refusals, officer: "Share of previous applications refused", format: share}
  PREV_REFUSED_RECENT_2Y_COUNT: {family: refusals, officer: "Applications refused in the last two years", format: count}
  PREV_CANCELED_SHARE: {family: refusals, officer: "Share of previous applications cancelled", format: share}
  PREV_APP_CREDIT_RATIO_MEAN: {family: refusals, officer: "Amount requested as a multiple of the amount granted (previous loans)", customer: "Amount requested compared with the amount granted on previous loans", format: times}

