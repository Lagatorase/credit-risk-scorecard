EXT_SOURCE_2: {name: "score from external credit bureau (source 2)", missing: "No score from external credit bureau (source 2)"}
EXT_SOURCE_3: {name: "score from external credit bureau (source 3)", missing: "No score from external credit bureau (source 3)"}
EXT_SOURCE_MEAN: {name: "average score from external credit bureaus", missing: "No scores from external credit bureaus"}
EXT_SOURCE_MIN: {name: "lowest score from external credit bureaus", missing: "No scores from external credit bureaus"}

