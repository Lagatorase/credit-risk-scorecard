  FLAG_WORK_PHONE: {family: application_details, officer: "Work phone provided", format: flag, officer_only: true}
  FLAG_CONT_MOBILE: {family: application_details, officer: "Mobile phone reachable", format: flag, officer_only: true}
  FLAG_PHONE: {family: application_details, officer: "Home phone provided", format: flag, officer_only: true}
  FLAG_EMAIL: {family: application_details, officer: "Email provided", format: flag, officer_only: true}
  FLAG_DOCUMENT_3: {family: application_details, officer: "Standard supporting document (document 3) provided", format: flag, officer_only: true}
  DOCUMENT_COUNT: {family: application_details, officer: "Supporting documents provided", format: count, officer_only: true}
