  BUREAU_DEBT_TOTAL: {family: other_lenders, officer: "Debt outstanding at other lenders", format: money}
  BUREAU_ACTIVE_ANNUITY_TOTAL: {family: other_lenders, officer: "Repayments due on open loans at other lenders", format: money}
