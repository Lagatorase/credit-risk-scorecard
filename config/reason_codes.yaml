  CC_BALANCE_MEAN: {family: credit_card, officer: "Average credit card balance", format: money}
  CC_LIMIT_MAX: {family: credit_card, officer: "Credit card limit", format: money}
  CC_DRAWINGS_MEAN: {family: credit_card, officer: "Average monthly credit card spending and withdrawals", format: money}
  CC_ATM_DRAWINGS_SHARE: {family: credit_card, officer: "Share of credit card drawings taken as cash", format: share}

