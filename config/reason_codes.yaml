  FLAG_OWN_CAR: {family: housing, officer: "Owns a car", format: category}
  FLAG_OWN_REALTY: {family: housing, officer: "Owns property", format: category}
  OWN_CAR_AGE: {family: housing, officer: "Age of car", format: years}
  APARTMENTS_AVG: {family: housing, officer: "Apartment size in the building (normalised)", customer: "Building information", format: score}
  BASEMENTAREA_AVG: {family: housing, officer: "Basement area in the building (normalised)", customer: "Building information", format: score}
  YEARS_BEGINEXPLUATATION_AVG: {family: housing, officer: "Time the building has been in use (normalised)", customer: "Building information", format: score}
  YEARS_BUILD_AVG: {family: housing, officer: "Building age (normalised, higher is newer)", customer: "Building information", format: score}
  COMMONAREA_AVG: {family: housing, officer: "Common area in the building (normalised)", customer: "Building information", format: score}
  ELEVATORS_AVG: {family: housing, officer: "Lifts in the building (normalised)", customer: "Building information", format: score}
  ENTRANCES_AVG: {family: housing, officer: "Entrances in the building (normalised)", customer: "Building information", format: score}
  FLOORSMAX_AVG: {family: housing, officer: "Building height, most floors (normalised)", customer: "Building information", format: score}
  FLOORSMIN_AVG: {family: housing, officer: "Building height, fewest floors (normalised)", customer: "Building information", format: score}
  LANDAREA_AVG: {family: housing, officer: "Land area of the building (normalised)", customer: "Building information", format: score}
  LIVINGAPARTMENTS_AVG: {family: housing, officer: "Living apartments in the building (normalised)", customer: "Building information", format: score}
  LIVINGAREA_AVG: {family: housing, officer: "Living area in the building (normalised)", customer: "Building information", format: score}
  NONLIVINGAPARTMENTS_AVG: {family: housing, officer: "Non-residential units in the building (normalised)", customer: "Building information", format: score}
  NONLIVINGAREA_AVG: {family: housing, officer: "Non-residential area in the building (normalised)", customer: "Building information", format: score}
  TOTALAREA_MODE: {family: housing, officer: "Total area of the building (normalised)", customer: "Building information", format: score}
  FONDKAPREMONT_MODE: {family: housing, officer: "Building repair fund type", customer: "Building information", format: category}
  HOUSETYPE_MODE: {family: housing, officer: "Building type", customer: "Building information", format: category}
  WALLSMATERIAL_MODE: {family: housing, officer: "Building wall material", customer: "Building information", format: category}
  EMERGENCYSTATE_MODE: {family: housing, officer: "Building emergency state", customer: "Building information", format: category}

  # Region and address
  REGION_POPULATION_RELATIVE: {family: region, officer: "Population density of home region (normalised)", customer: "Population density of your home region (relative scale)", format: score}
  REGION_RATING_CLIENT: {family: region, officer: "Home Credit's rating of the home region (1 best, 3 worst)", customer: "Home region rating", format: number}
  REGION_RATING_CLIENT_W_CITY: {family: region, officer: "Home Credit's rating of the home region and city (1 best, 3 worst)", customer: "Home region rating", format: number}
  REG_REGION_NOT_LIVE_REGION: {family: region, officer: "Registered address in a different region from home", format: flag}
  REG_REGION_NOT_WORK_REGION: {family: region, officer: "Registered address in a different region from work", format: flag}
  LIVE_REGION_NOT_WORK_REGION: {family: region, officer: "Lives in a different region from work", format: flag}
