  OCCUPATION_TYPE: {family: employment, officer: "Occupation", format: category}
  ORGANIZATION_TYPE: {family: employment, officer: "Employer sector", format: category}

  # Age and household (age-based reasons are for the loan officer only)
  AGE_YEARS: {family: demographics, officer: "Age", format: years, officer_only: true}
  EMPLOYED_TO_AGE_RATIO: {family: demographics, officer: "Employment length as a share of age", format: share, officer_only: true}
  CNT_CHILDREN: {family: demographics, officer: "Children", format: count}
  CNT_FAM_MEMBERS: {family: demographics, officer: "Household size", format: count}
  NAME_EDUCATION_TYPE: {family: demographics, officer: "Education", format: category}

