  AMT_REQ_CREDIT_BUREAU_WEEK: {family: enquiries, officer: "Credit checks in the week before applying", format: count}
  AMT_REQ_CREDIT_BUREAU_MON: {family: enquiries, officer: "Credit checks in the month before applying", format: count}
  AMT_REQ_CREDIT_BUREAU_QRT: {family: enquiries, officer: "Credit checks in the three months before applying", format: count}
  AMT_REQ_CREDIT_BUREAU_YEAR: {family: enquiries, officer: "Credit checks in the year before applying", format: count}

  # Social circle: about other people, so officer only
  OBS_30_CNT_SOCIAL_CIRCLE: {family: social_circle, officer: "Social contacts with a credit history (30 days)", format: count, officer_only: true}
  OBS_60_CNT_SOCIAL_CIRCLE: {family: social_circle, officer: "Social contacts with a credit history (60 days)", format: count, officer_only: true}
