# Plain-English reason code text for every model feature.
#
# Numeric features: "name" gives the default texts "High <name>" and "Low <name>", used when the
# applicant's value is above or at-or-below the development median. "high", "low" and "missing"
# override those defaults where the plain version would read badly (day counts are negative, so
# "high" means more recent).
# Yes/no flags: "flag_yes" is shown when the value is 1, "flag_no" when it is 0 (plain yes/no keys would load as booleans).
# Categorical features: "text" with {value} replaced by the applicant's category, or "values" with one text per category.
# customer: false means the reason can be shown to a loan officer but never to the customer.
# Gender and marital status are not model inputs, so they never appear here.

# Loan and applicant details
NAME_CONTRACT_TYPE: {text: "Loan product type ({value})"}
AMT_CREDIT: {name: "loan amount"}
AMT_ANNUITY: {name: "yearly repayment amount"}
AMT_GOODS_PRICE: {name: "price of the goods being financed", missing: "Price of the goods being financed not stated"}
AMT_INCOME_TOTAL: {name: "stated income"}
INCOME_PER_PERSON: {name: "income per household member"}
CNT_CHILDREN: {high: "Several dependent children", low: "No dependent children"}
CNT_FAM_MEMBERS: {name: "household size"}
NAME_TYPE_SUITE: {text: "Accompanied when applying ({value})", missing: "Not recorded who accompanied the applicant"}
NAME_INCOME_TYPE: {text: "Income source ({value})"}
NAME_EDUCATION_TYPE: {text: "Education level ({value})"}
NAME_HOUSING_TYPE: {text: "Housing situation ({value})"}
OCCUPATION_TYPE: {text: "Occupation ({value})", missing: "Occupation not stated"}
ORGANIZATION_TYPE: {text: "Employer sector ({value})"}
FLAG_OWN_CAR: {values: {"Y": "Owns a car", "N": "Does not own a car"}}
FLAG_OWN_REALTY: {values: {"Y": "Owns property", "N": "Does not own property"}}
OWN_CAR_AGE: {high: "Owns an older car", low: "Owns a recent car", missing: "No car recorded"}

# Affordability ratios
CREDIT_INCOME_RATIO: {high: "Loan amount is high relative to income", low: "Loan amount is low relative to income"}
ANNUITY_INCOME_RATIO: {high: "Repayments are high relative to income", low: "Repayments are low relative to income"}
ANNUITY_CREDIT_RATIO: {high: "Short repayment term (high repayment relative to the loan)", low: "Long repayment term (low repayment relative to the loan)"}
CREDIT_GOODS_RATIO: {high: "Loan amount is high relative to the price of the goods", low: "Loan amount is close to the price of the goods", missing: "Price of the goods being financed not stated"}

# Age and employment (age-based reasons are for the loan officer only)
AGE_YEARS: {name: "applicant age", customer: false}
EMPLOYED_TO_AGE_RATIO: {high: "Long employment relative to age", low: "Short employment relative to age", missing: "No current employment recorded", customer: false}
EMPLOYED_YEARS: {high: "Long time with current employer", low: "Short time with current employer", missing: "No current employment recorded"}
DAYS_EMPLOYED_PLACEHOLDER: {flag_yes: "No current employment recorded (for example retired)", flag_no: "Currently employed"}

