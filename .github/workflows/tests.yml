name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # the tests use synthetic tables built from a schema with no real rows, a small made-up model and no LLM,
      # so they need no Home Credit data, no trained model and no API keys
      - name: Run tests
        run: pytest -q
